<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IDM Replica</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body { width: 380px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 15px; margin: 0; }
    .list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow: auto; }
    .row { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--panel); }
    .row .info { flex: 1; min-width: 0; }
    .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .row .meta { color: var(--dim); font-size: 12px; }
    .empty { color: var(--dim); padding: 10px 0; text-align: center; }
    .paste { display: flex; gap: 6px; }
    .paste input { flex: 1; min-width: 0; }
    .cta { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--accent);
      border-radius: 8px; background: var(--panel); }
    .cta[hidden] { display: none; }
    .cta b { font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>IDM Replica</h1>
    <a href="#" id="options">Options</a>
  </header>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">Checking the app…</span></div>
  <div class="cta" id="cta" hidden>
    <b id="cta-title"></b>
    <span class="dim" id="cta-text"></span>
    <button id="cta-btn" class="primary"></button>
  </div>
  <div class="list" id="list"></div>
  <button id="all" class="primary" hidden>Download all</button>
  <div class="paste">
    <input type="text" id="url" placeholder="Paste any link to send to IDM Replica" spellcheck="false" />
    <button id="send">Send</button>
  </div>
  <div class="msg" id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
