<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blob Player Test Film (2026)</title>
  <!-- The extension's MAIN-world probe, first, as Chrome injects it at document_start. -->
  <script src="/disguised/page-probe.js"></script>
  <!-- A real MediaSource player (blob: src), like most third-party hosts use. -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <style>body { font: 14px system-ui; margin: 24px; } video { width: 640px; background: #000; }</style>
</head>
<body>
  <h1>Blob player test</h1>
  <p>Playlist at <code>/disguised/master.txt</code> (text/plain, needs Referer/Origin).</p>
  <video id="v" controls muted></video>
  <h2>Playlists the probe reported</h2>
  <pre id="out">(none yet)</pre>
  <script>
    const out = document.getElementById("out");
    const seen = [];
    window.addEventListener("message", (e) => {
      if (e.source === window && e.data && e.data.type === "idm-replica:manifest") {
        seen.push(`${e.data.kind}${e.data.master ? " (master)" : ""}  ${e.data.url}`);
        out.textContent = seen.join("\n");
      }
    });
    const v = document.getElementById("v");
    const hls = new Hls();
    hls.loadSource("/disguised/master.txt");
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  </script>
</body>
</html>
