[package]
name = "idm-replica"
version = "0.1.0"
description = "A cross-platform download manager with dynamic file segmentation (IDM-style)"
authors = ["you"]
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# --- Tauri / IPC ---
# Allowlist is empty (the UI only uses invoke + events). `dialog` enables the
# Rust-side Save-As API (`tauri::api::dialog`) without exposing it to JS.
tauri = { version = "1.6", features = ["dialog", "system-tray"] }
# One app instance at a time (a second launch focuses the first and exits).
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

# --- Async runtime ---
# Only what the app uses ("full" also pulls signal handling, stdio, parking_lot).
tokio = { version = "1.37", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "net",
    "process",
] }

# --- HTTP ---
# No gzip/brotli: Range offsets must refer to raw file bytes, so downloads
# always request `Accept-Encoding: identity` (see `apply_headers`).
# TLS: on Windows (the shipping target) use the OS's own TLS (schannel) and
# certificate store — no bundled TLS stack or root list in the exe. Elsewhere
# rustls, so no OpenSSL is needed to build.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

# --- Streaming helpers ---
futures-util = "0.3"
bytes = "1.6"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Utility ---
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
async-trait = "0.1"

# --- Integrity hashing ---
sha2 = "0.10"
md-5 = "0.10"

# --- Browser bridge (localhost HTTP API for the extension; see bridge.rs) ---
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
# OS CSPRNG for the bridge token.
getrandom = "0.2"

# --- Component manager: unpack the pinned FFmpeg zip (deflate only) ---
zip = { version = "2", default-features = false, features = ["deflate"] }

# --- Structured logging ---
tracing = "0.1"
# No `env-filter`: it drags in regex (~220 KB). One global level is enough.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "registry",
] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# Local HTTP fixture server for deterministic engine tests.
axum = "0.7"
# A test captures logs with a per-target filter.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# opt-level "s": measured with scripts/bench-download.mjs (3000 MB local file,
# 6 runs each, 2026-10-12) at the same throughput as 3 (~1050 MB/s) with a
# 2 MB smaller exe; "z" was ~13% slower. panic = "unwind": a panic ends only
# the task/thread it happened in instead of closing the whole app.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
