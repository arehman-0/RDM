[package]
name = "idm-replica"
version = "0.1.0"
description = "A cross-platform download manager with dynamic file segmentation (IDM-style)"
authors = ["you"]
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# --- Tauri / IPC ---
# Allowlist is empty (the UI only uses invoke + events). `dialog` enables the
# Rust-side Save-As API (`tauri::api::dialog`) without exposing it to JS.
tauri = { version = "1.6", features = ["dialog"] }
# One app instance at a time (a second launch focuses the first and exits).
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

# --- Async runtime ---
tokio = { version = "1.37", features = ["full"] }

# --- HTTP ---
# No gzip/brotli: Range offsets must refer to raw file bytes, so downloads
# always request `Accept-Encoding: identity` (see `apply_headers`).
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
] }

# --- Streaming helpers ---
futures-util = "0.3"
bytes = "1.6"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Utility ---
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
num_cpus = "1.16"
async-trait = "0.1"

# --- Integrity hashing ---
sha2 = "0.10"
md-5 = "0.10"

# --- Browser bridge (localhost HTTP API for the extension; see bridge.rs) ---
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
# OS CSPRNG for the bridge token.
getrandom = "0.2"

# --- Structured logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Local HTTP fixture server for deterministic engine tests.
axum = "0.7"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
